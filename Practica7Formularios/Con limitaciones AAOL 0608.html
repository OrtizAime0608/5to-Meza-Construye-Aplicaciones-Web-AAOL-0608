<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios en HTML</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body> 
    <h2>Formulario con limitaciones</h2>
  
   <!-- Inicia el formulario, action="" define la URL a donde se enviaran los datos y method="post" envía la información de forma oculta -->
    <form action="" method="post">
      <!-- Texto que se visualiza para indicar al usuario que ingresara, pide tu nombre-->
    Ingresa tu nombre:

      
    <!-- disabled: Desactiva por completo el campo. El usuario no puede hacer clic, ni escribir, ni modificar su contenido. -->
    <input type="text" name="nombre" disabled><br>

      
  <!-- Texto que se visualiza para indicar al usuario que ingresara, pide tu contraseña-->
    Contraseña:
         <!-- Establece la cantidad máxima de caracteres que el usuario puede ingresar. -->
    <input type="password" name="pass" maxlength="5"><br>

      
    
        <!-- Texto que se visualiza para indicar al usuario que vera-->
    Comentarios:

      <!--readonly: Permite al usuario seleccionar y copiar el texto existente, pero no le permite modificarlo ni borrarlo-->
      <!--<textarea> está diseñada para que el usuario pueda ingresar textos largos, párrafos o comentarios de varias líneas.-->
    <textarea name="comentarios" readonly>
    
    Este es mi comentario y no se puede borrar
    </textarea><br>
    </form>
</body>
</html>
