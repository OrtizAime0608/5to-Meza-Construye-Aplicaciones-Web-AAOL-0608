<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios en HTML</title>
    
    <!-- Libreria de iconos en linea -->
    <!-- Es un enlace para una hoja de estilos externa -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
    awesome/7.3.1/css/all.min.css">

</head>
<body> 
    <h2>Formulario con botones</h2>
    <!-- Inicia el formulario, action="" define la URL a donde se enviaran los datos y y method="post" envía la información de forma oculta -->
    <form action="" method="post">
       <!-- Texto que se vizualiza para indicar al usuario que ingresara, pide tu nombre-->
    Ingresa tu nombre:
       <!-- Formato de texto que el usuario ingresara (texto), nombre es la variable donde se guardara  -->
    <input type="text" name="nombre">
    <br>

      <!--'button' es un boton que permite incluir texto , html e iconos-->
      <!--'type=subimit' le indica al navegador que al presionarlo debe provesar y enviar los datos-->
      <!--En este caso i no sirve para letra en cursiva  si no para insertar iconos-->
      <!--la clase que llama invoca la clase de Font Awesome para mostrar un ícono de un avión de papel.-->
    <button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
      
      <!--'button' es un boton que permite incluir texto , html e iconos-->
      <!--'type=subimit' le indica al navegador que al presionarlo debe provesar y enviar los datos-->
      <!--En este caso i no sirve para letra en cursiva  si no para insertar iconos-->
      <!--la clase que llama invoca el ícono de un bote de basura de Font Awesome..-->
    <button type="reset">Borrar <i class="fa fa-trash"></i></button>
    </form>
</body>
</html>
