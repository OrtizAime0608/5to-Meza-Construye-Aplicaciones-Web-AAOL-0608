<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>

<!-- Libreria de iconos en linea -->
<!-- Es un enlace para una hoja de estilos externa -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">

</head>
<body> 

  <!-- Titulo principal del formulario -->
  <h2>Formulario para contraseñas</h2>
    
  <!-- Inicia el formulario, action="" define la URL a donde se enviaran los datos y y method="post" envía la información de forma oculta -->
  <form action="" method="post">

          <!-- Texto que se vizualiza para indicar al usuario que ingresara, pide tu usuario-->
    Ingresa tu usuario:
        <!-- Formato de texto que el usuario ingresara (texto) ,usuario es la variable donde se guardara  -->
    <input type="text" name="usuario">

        <!-- Texto que se vizualiza para indicar al usuario que ingresara, pide tu contraseña-->
    Ingresa tu contraseña:
       <!-- Formato de texto que el usuario ingresara (password) , pass es la variable donde se guardara  -->
    <input type="password" name="pass">
       <!-- Salto de linea -->
  <br>

       <!-- Boton que al presionar , envia los datos (submit da la instrucción de procesar y enviar datos) -->
       <!-- value muestra el texto visible del campo (enviar)-->
  <input type="submit" value="enviar">

       <!-- Boton que al presionar , restablece y limpia los campos (submit da la instrucción de procesar y enviar datos) -->
       <!-- value muestra el texto visible del campo  (borrar)-->
  <input type="reset" value="borrar">
  </form>
</body>
</html>
