<!DOCTYPE html>
<!-- Especifica que el documento es HTML5 -->
<html lang="es">

<head>
  <!-- Configuración de metadatos del documento -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Título mostrado en la pestaña del navegador -->
  <title>Formularios en HTML</title>

  <!-- Carga de biblioteca de íconos Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <h2>Formulario para contraseñas</h2>
  <form action="" method="post">

    Ingresa tu usuario:
    <input type="text" name="usuario">
    Ingresa tu contraseña:
    <input type="password" name="pass">
  <br>
  <input type="submit" value="enviar">
  <input type="reset" value="borrar">
  </form>
</body>
</html>
